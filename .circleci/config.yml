          command: |
            cat /tmp/clang/orchard-crimson-alpha
      - run:
          name: Checkout main
          command: git clone --depth 3 -q --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull reference data
          command: tar xf assets-vault.tar
